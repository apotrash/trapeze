<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trapèze</title>
<meta name="description" content="Transcription et synthèse vidéo pour Mac.">
<link rel="icon" href="logo.svg">
<style>
  :root { --papier: #f4f1ea; --encre: #14160f; --gris: #6b6a63; --jaune: #e8ee6f; }
  @media (prefers-color-scheme: dark) {
    :root { --papier: #0f100c; --encre: #f2f0e8; --gris: #9a998f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--papier); color: var(--encre);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 32px;
  }
  main { text-align: center; }
  img { width: 132px; height: 132px; border-radius: 30px; display: block; margin: 0 auto 36px; }
  a {
    display: inline-block; background: var(--jaune); color: #14160f;
    text-decoration: none; font-size: 17px; font-weight: 700;
    padding: 17px 34px; border-radius: 14px;
    border: 1px solid rgba(0,0,0,.08);
    transition: transform .12s ease, filter .12s ease;
  }
  a:hover { transform: translateY(-1px); filter: brightness(1.04); }
  p { margin: 16px 0 0; font-size: 14px; color: var(--gris); }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="Trapèze" width="132" height="132">
  <a id="telecharger" href="https://github.com/apotrash/trapeze/releases/latest">Télécharger pour Mac</a>
  <p id="details">Apple Silicon</p>
</main>
<script>
/* Le bouton doit toujours mener à la dernière version sans qu'on retouche
   cette page à chaque publication. Si l'API de GitHub ne répond pas, le lien
   de repli mène à la page des versions, qui reste utilisable. */
(async () => {
  try {
    const reponse = await fetch('https://api.github.com/repos/apotrash/trapeze/releases/latest');
    if (!reponse.ok) return;
    const version = await reponse.json();
    const image = (version.assets || []).find((f) => f.name.endsWith('.dmg'));
    if (!image) return;
    document.getElementById('telecharger').href = image.browser_download_url;
    document.getElementById('details').textContent =
      `Version ${String(version.tag_name).replace(/^v/, '')} · ${Math.round(image.size / 1048576)} Mo · Apple Silicon`;
  } catch {}
})();
</script>
</body>
</html>
