<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trapèze</title>
<meta name="description" content="Transcription et synthèse vidéo pour Mac et Windows.">
<link rel="icon" href="logo.svg">
<style>
  :root { --papier: #f4f1ea; --encre: #14160f; --gris: #6b6a63; --jaune: #e8ee6f; }
  @media (prefers-color-scheme: dark) {
    :root { --papier: #0f100c; --encre: #f2f0e8; --gris: #9a998f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--papier); color: var(--encre);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 32px;
  }
  main { text-align: center; }
  img { width: 132px; height: 132px; border-radius: 30px; display: block; margin: 0 auto 36px; }
  .boutons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  /* Le pictogramme dit le système avant que l'étiquette soit lue, et il aligne
     les deux boutons sur une même ligne de base optique. */
  a { display: inline-flex; align-items: center; gap: 10px; }
  a svg { width: 19px; height: 19px; flex: none; }
  a {
    display: inline-block; background: var(--jaune); color: #14160f;
    text-decoration: none; font-size: 17px; font-weight: 700;
    padding: 17px 34px; border-radius: 14px;
    border: 1px solid rgba(0,0,0,.08);
    transition: transform .12s ease, filter .12s ease;
  }
  /* Windows reste au second plan tant que le binaire n'est pas signé : c'est
     un essai, pas une version que l'on met dans les mains de n'importe qui. */
  a.essai { background: transparent; color: var(--encre); border-color: var(--gris); font-weight: 600; }
  a:hover { transform: translateY(-1px); filter: brightness(1.04); }
  p { margin: 16px 0 0; font-size: 14px; color: var(--gris); }
  p.avertissement { margin-top: 10px; font-size: 13px; max-width: 30rem; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="Trapèze" width="132" height="132">
  <div class="boutons">
    <a id="telecharger" href="https://github.com/apotrash/trapeze/releases/latest">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.7 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.6-.7 2.9-.7s1.7.7 2.9.7 2-1.1 2.7-2.2c.9-1.2 1.2-2.4 1.2-2.5 0 0-2.3-.9-2.3-3.6zM14.5 5.3c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-.9 2.8 1 .1 2-.5 2.7-1.3z"/></svg>
      Télécharger pour Mac
    </a>
    <a id="telecharger-windows" class="essai" href="https://github.com/apotrash/trapeze/releases/latest">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.6l7.2-1v6.9H3V5.6zm0 12.8l7.2 1v-6.8H3v5.8zm8 1.1l10 1.4v-8.3H11v6.9zm0-15.1v7h10V3l-10 1.4z"/></svg>
      Windows (essai)
    </a>
  </div>
  <p id="details">Apple Silicon</p>
  <p class="avertissement">La version Windows n’est pas encore signée : Windows affichera « Windows a protégé votre PC ». Choisissez « Informations complémentaires », puis « Exécuter quand même ».</p>
</main>
<script>
/* Le bouton doit toujours mener à la dernière version sans qu'on retouche
   cette page à chaque publication. Si l'API de GitHub ne répond pas, le lien
   de repli mène à la page des versions, qui reste utilisable. */
(async () => {
  try {
    const reponse = await fetch('https://api.github.com/repos/apotrash/trapeze/releases/latest');
    if (!reponse.ok) return;
    const version = await reponse.json();
    const actifs = version.assets || [];
    const image = actifs.find((f) => f.name.endsWith('.dmg'));
    /* L'installeur, et non l'archive : c'est lui qui pose l'application là où
       la mise à jour interne saura la remplacer. */
    const windows = actifs.find((f) => f.name.endsWith('.exe'));
    const numero = String(version.tag_name).replace(/^v/, '');
    const taille = (f) => `${Math.round(f.size / 1048576)} Mo`;
    const morceaux = [`Version ${numero}`];
    if (image) {
      document.getElementById('telecharger').href = image.browser_download_url;
      morceaux.push(`Mac Apple Silicon ${taille(image)}`);
    }
    const bouton = document.getElementById('telecharger-windows');
    /* Aucun paquet Windows dans cette version : le bouton disparaît plutôt que
       de mener à une page où l'utilisateur ne trouverait rien. */
    if (windows) {
      bouton.href = windows.browser_download_url;
      morceaux.push(`Windows 64 bits ${taille(windows)}`);
    } else {
      bouton.remove();
      document.querySelector('.avertissement')?.remove();
    }
    document.getElementById('details').textContent = morceaux.join(' · ');
  } catch {}
})();
</script>
</body>
</html>
